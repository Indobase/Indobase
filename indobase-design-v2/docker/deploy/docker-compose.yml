# Indobase Design — Canva-class editor (production + staging aliases on Vyom .249)
#
# Canonical hosts: design.indobase.in · design.indobase.fun
# Legacy staging alias: studio-design.indobase.fun
# Source: indobase-design-v2/ (Fabric.js / Preact). Pin image with DESIGN_VERSION=<git-sha>.

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

name: indobase-design-v2

volumes:
  design_v2_pgdata:

networks:
  indobase_design_v2_net:
    name: indobase-design-v2
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

services:
  design-app:
    <<: [*restart, *logging]
    build:
      context: ../..
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/Indobase/Indobase
        org.opencontainers.image.title: indobase-design
        org.opencontainers.image.revision: ${DESIGN_VERSION:-dev}
    image: indobase-design-v2:${DESIGN_VERSION:-0.1.0}
    depends_on:
      design-postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      # Shared with Studio — same secret Studio signs the design handoff with. The app refuses to
      # start if this is missing or under 32 chars rather than serving unauthenticated.
      DESIGN_HANDOFF_SECRET: ${DESIGN_HANDOFF_SECRET:?set DESIGN_HANDOFF_SECRET}
      STUDIO_URL: ${STUDIO_URL:-https://studio.indobase.in}
      DESIGN_DATABASE_URL: postgresql://${DB_USER:-design}:${DB_PASSWORD:?set DB_PASSWORD}@design-postgres:5432/${DB_NAME:-design}
      DESIGN_DB_POOL_MAX: ${DESIGN_DB_POOL_MAX:-10}
    networks:
      - indobase_design_v2_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-design-v2.rule=${DESIGN_V2_TRAEFIK_RULE:-Host(`design.indobase.in`) || Host(`design.indobase.fun`) || Host(`studio-design.indobase.fun`)}
      - traefik.http.routers.indobase-design-v2.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-design-v2.tls=true
      - traefik.http.routers.indobase-design-v2.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-design-v2.tls.domains[0].main=design.indobase.in
      - traefik.http.routers.indobase-design-v2.tls.domains[0].sans=design.indobase.fun,studio-design.indobase.fun
      - traefik.http.routers.indobase-design-v2.service=indobase-design-v2
      - traefik.http.routers.indobase-design-v2.priority=20
      - traefik.http.services.indobase-design-v2.loadbalancer.server.port=8080
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  design-postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-design}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-design}
    volumes:
      - design_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indobase_design_v2_net
