# Indobase Helpdesk — production / staging Compose (Vyom .249)
#
# Hosts:
#   prod:    helpdesk.indobase.in
#   staging: helpdesk.indobase.fun
#
# First boot initializes Frappe bench + Frappe Helpdesk (~5–10 min). Bridge serves SSO;
# Traefik terminates TLS and routes to bridge (which proxies /h/*, /portal/*, /helpdesk/* upstream).
#
# Bench data lives on helpdesk_bench_sites → /home/frappe/persist (full bench, not
# sites-only). Host must chown the volume to uid/gid 1000 before first boot:
#   docker run --rm -v indobase-helpdesk_helpdesk_bench_sites:/v alpine chown -R 1000:1000 /v

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  helpdesk_mariadb_data:
  helpdesk_bench_sites:

networks:
  helpdesk_net:
    name: indobase-helpdesk
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-helpdesk

services:
  helpdesk-mariadb:
    <<: *restart
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes:
      - helpdesk_mariadb_data:/var/lib/mysql
    networks:
      - helpdesk_net
    logging: *logging

  helpdesk-redis:
    <<: *restart
    image: redis:7.2-alpine
    networks:
      - helpdesk_net
    logging: *logging

  helpdesk-frappe:
    <<: *restart
    image: frappe/bench:latest
    depends_on:
      - helpdesk-mariadb
      - helpdesk-redis
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      HELPDESK_SITE_NAME: ${HELPDESK_SITE_NAME:-helpdesk.localhost}
      HELPDESK_ADMIN_PASSWORD: ${HELPDESK_ADMIN_PASSWORD:-changeme}
      HELPDESK_HANDOFF_SECRET: ${HELPDESK_HANDOFF_SECRET:?set HELPDESK_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
    volumes:
      - helpdesk_bench_sites:/home/frappe/persist
      - ../init-helpdesk.sh:/workspace/init-helpdesk.sh:ro
      - ../../frappe-app/indobase_helpdesk:/workspace/indobase_helpdesk:ro
    command: bash /workspace/init-helpdesk.sh
    networks:
      - helpdesk_net
    logging: *logging

  helpdesk-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      - helpdesk-frappe
    environment:
      PORT: "8095"
      HELPDESK_HANDOFF_SECRET: ${HELPDESK_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      HELPDESK_UPSTREAM: http://helpdesk-frappe:8000
      FRAPPE_STUDIO_HANDOFF_URL: http://helpdesk-frappe:8000/api/method/indobase_helpdesk.api.studio_handoff.exchange
      HELPDESK_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    networks:
      - helpdesk_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # Prod default is .indobase.in only — include .fun only when that DNS exists (avoids LE NXDOMAIN + rate limits).
      - traefik.http.routers.indobase-helpdesk.rule=${HELPDESK_TRAEFIK_RULE:-Host(`helpdesk.indobase.in`)}
      - traefik.http.routers.indobase-helpdesk.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-helpdesk.tls=true
      - traefik.http.routers.indobase-helpdesk.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-helpdesk.loadbalancer.server.port=8095
    logging: *logging
