# Indobase Analytics — Compose on Vyom .249 (no public Caddy; Traefik terminates TLS)
#
#   cd /opt/indobase-analytics/docker/deploy
#   cp .env.example .env   # fill secrets
#   docker compose --env-file .env up -d --build
#
# Or pull CI images:
#   BACKEND_IMAGE=roshanraghavander/indobase-analytics-backend:<sha> \
#   CLIENT_IMAGE=roshanraghavander/indobase-analytics-client:<sha> \
#   docker compose --env-file .env up -d
#
# Hosts: analytics.indobase.fun · analytics.indobase.in

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

x-restart: &restart
  restart: unless-stopped

name: indobase-analytics

networks:
  indobase_analytics_net:
    name: indobase-analytics
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

volumes:
  analytics_clickhouse:
  analytics_postgres:
  analytics_redis:

services:
  edge:
    <<: *restart
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - client
    networks:
      - indobase_analytics_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-analytics.rule=${ANALYTICS_TRAEFIK_RULE:-Host(`analytics.indobase.in`) || Host(`analytics.indobase.fun`)}
      - traefik.http.routers.indobase-analytics.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-analytics.tls=true
      - traefik.http.routers.indobase-analytics.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-analytics.tls.domains[0].main=analytics.indobase.in
      - traefik.http.routers.indobase-analytics.tls.domains[0].sans=analytics.indobase.fun
      - traefik.http.routers.indobase-analytics.service=indobase-analytics
      - traefik.http.services.indobase-analytics.loadbalancer.server.port=80
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/sso/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:26.3.17.4
    volumes:
      - analytics_clickhouse:/var/lib/clickhouse
    configs:
      - source: clickhouse_network
        target: /etc/clickhouse-server/config.d/network.xml
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/logging_rules.xml
      - source: clickhouse_resource_limits
        target: /etc/clickhouse-server/config.d/resource_limits.xml
      - source: clickhouse_user_settings
        target: /etc/clickhouse-server/users.d/user_settings.xml
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    networks:
      - indobase_analytics_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  postgres:
    <<: *restart
    image: postgres:17.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    volumes:
      - analytics_postgres:/var/lib/postgresql/data
    networks:
      - indobase_analytics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging

  redis:
    <<: *restart
    image: redis:8.6.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - analytics_redis:/data
    networks:
      - indobase_analytics_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging

  backend:
    <<: *restart
    build:
      context: ../..
      dockerfile: ./server/Dockerfile
    image: ${BACKEND_IMAGE:-indobase-analytics-backend:local}
    environment:
      NODE_ENV: production
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BASE_URL: ${BASE_URL:-https://analytics.indobase.in}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-true}
      ANALYTICS_HANDOFF_SECRET: ${ANALYTICS_HANDOFF_SECRET:?set ANALYTICS_HANDOFF_SECRET}
      STUDIO_HANDOFF_SECRET: ${STUDIO_HANDOFF_SECRET:-}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      ANALYTICS_SITE_DOMAIN_SUFFIX: ${ANALYTICS_SITE_DOMAIN_SUFFIX:-indobase.in}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - indobase_analytics_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s
    logging: *logging

  client:
    <<: *restart
    build:
      context: ../..
      dockerfile: ./client/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${BASE_URL:-https://analytics.indobase.in}
        NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
        NEXT_PUBLIC_STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
        NEXT_PUBLIC_LITE_DASHBOARD: ${LITE_DASHBOARD:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-${SENTRY_DSN:-}}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    image: ${CLIENT_IMAGE:-indobase-analytics-client:local}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${BASE_URL:-https://analytics.indobase.in}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      NEXT_PUBLIC_STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      NEXT_PUBLIC_LITE_DASHBOARD: ${LITE_DASHBOARD:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-${SENTRY_DSN:-}}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - backend
    networks:
      - indobase_analytics_net
    logging: *logging

configs:
  clickhouse_network:
    content: |
      <clickhouse>
        <listen_host>0.0.0.0</listen_host>
      </clickhouse>

  clickhouse_logging:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <query_views_log remove="remove"/>
        <query_metric_log remove="remove"/>
        <error_log remove="remove"/>
        <opentelemetry_span_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>
      </clickhouse>

  clickhouse_resource_limits:
    content: |
      <clickhouse>
        <max_server_memory_usage_to_ram_ratio>0.70</max_server_memory_usage_to_ram_ratio>
        <concurrent_threads_soft_limit_ratio_to_cores>1</concurrent_threads_soft_limit_ratio_to_cores>
        <merges_mutations_memory_usage_to_ram_ratio>0.25</merges_mutations_memory_usage_to_ram_ratio>
      </clickhouse>

  clickhouse_user_settings:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <enable_json_type>1</enable_json_type>
            <async_insert>1</async_insert>
            <wait_for_async_insert>1</wait_for_async_insert>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
            <log_processors_profiles>0</log_processors_profiles>
            <max_memory_usage>16000000000</max_memory_usage>
            <max_threads>8</max_threads>
          </default>
        </profiles>
      </clickhouse>
