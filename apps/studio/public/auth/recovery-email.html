<h2>Reset your password</h2>
<p>Enter this verification code in Indobase Studio:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 0.2em;">{{ .Token }}</p>
<p>If you did not request a password reset, you can ignore this email.</p>
<p>Or follow this link:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}">Reset password</a></p>
