_format_version: '2.1'
_transform: true

###
### Global plugins
###
plugins:
  # Best-effort attribution for logs/quotas.
  # If you run per-project subdomains like <project-ref>.<domain>,
  # this injects the x-project-ref header for all upstream services.
  - name: pre-function
    config:
      access:
        - |
          -- NOTE: this file is env-substituted via a shell eval in docker-compose.
          -- Use single quotes in Lua strings to avoid breaking the surrounding double-quoted echo.
          local host = ngx.var.host or ''
          if not kong.request.get_header('x-project-ref') then
            local first = host:match('^([a-z0-9%-]+)%.')
            if first then
              local reserved = {
                api = true,
                dashboard = true,
                studio = true,
                auth = true,
                realtime = true,
                storage = true,
                functions = true,
                meta = true,
                kong = true,
              }
              if not reserved[first] then
                kong.service.request.set_header('x-project-ref', first)
              end
            end
          end
          local apikey = kong.request.get_header('apikey')
          if not apikey then
            apikey = kong.request.get_query_arg('apikey')
          end
          if apikey and not kong.request.get_header('x-project-ref') then
            local parts = {}
            for part in string.gmatch(apikey, '[^.]+') do
              table.insert(parts, part)
            end
            if #parts >= 2 then
              local payload_b64 = parts[2]:gsub('-', '+'):gsub('_', '/')
              local pad = 4 - (#payload_b64 % 4)
              if pad < 4 then
                payload_b64 = payload_b64 .. string.rep('=', pad)
              end
              local decoded = ngx.decode_base64(payload_b64)
              if decoded then
                -- Single-quoted Lua pattern only: docker-compose envsubst must not see shell `"` here.
                local ref = decoded:match('project_ref%s*:%s*"?([a-z0-9%-]+)"?')
                if ref then
                  kong.service.request.set_header('x-project-ref', ref)
                end
              end
            end
          end

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### Dashboard credentials
###
basicauth_credentials:
  - consumer: DASHBOARD
    username: '$DASHBOARD_USERNAME'
    password: '$DASHBOARD_PASSWORD'

###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    url: http://indobase-auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
        config: &indobase_cors
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          origins:
            - $SITE_URL
            - $API_EXTERNAL_URL
            - $CORS_TENANT_ORIGIN_REGEX
          headers:
            - '*'
          exposed_headers:
            - '*'
          credentials: true
          max_age: 3600
  - name: auth-v1-open-callback
    url: http://indobase-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
  - name: auth-v1-open-authorize
    url: http://indobase-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
        config:
          <<: *indobase_cors

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'Indobase Auth (GoTrue): /auth/v1/* -> http://auth:9999/*'
    url: http://indobase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: false
      # MVP quota enforcement: per-project RPM keyed by x-project-ref injected globally.
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## Secure REST routes
  - name: rest-v1
    _comment: 'Indobase REST (PostgREST): /rest/v1/* -> http://rest:3000/*'
    url: http://indobase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: true
      # MVP quota enforcement: per-project RPM keyed by x-project-ref injected globally.
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'Indobase GraphQL (PostgREST): /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://indobase-rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Indobase Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev.indobase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin
  - name: realtime-v1-rest
    _comment: 'Indobase Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev.indobase-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin
  ## Storage routes: the storage server manages its own auth
  - name: storage-v1
    _comment: 'Indobase Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://indobase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  - name: storage-s3-admin
    _comment: 'Indobase Storage S3 admin: /s3/* -> http://storage:5000/s3/*'
    url: http://indobase-storage:5000/s3
    routes:
      - name: storage-s3-all
        strip_path: true
        paths:
          - /s3/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## Edge Functions routes
  - name: functions-v1
    _comment: 'Indobase Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://indobase-edge-functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## Shared gateway (Free tier): per-project sidecars via tenant multiplexer.
  ## Matched when pre-function injects x-project-ref from project JWT apikey or subdomain.
  - name: rest-v1-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    routes:
      - name: rest-v1-shared-gateway
        strip_path: false
        paths:
          - /rest/v1/
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
  - name: auth-v1-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    routes:
      - name: auth-v1-shared-gateway
        strip_path: false
        paths:
          - /auth/v1/
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
  - name: storage-v1-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    routes:
      - name: storage-v1-shared-gateway
        strip_path: false
        paths:
          - /storage/v1/
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
  - name: realtime-v1-ws-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    protocol: ws
    routes:
      - name: realtime-v1-ws-shared-gateway
        strip_path: false
        paths:
          - /realtime/v1/
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
  - name: functions-v1-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    routes:
      - name: functions-v1-shared-gateway
        strip_path: false
        paths:
          - /functions/v1/
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: rate-limiting
        config:
          policy: local
          limit_by: header
          header_name: x-project-ref
          minute: 600
  - name: graphql-v1-shared-gateway
    url: http://indobase-tenant-multiplexer:8090/
    routes:
      - name: graphql-v1-shared-gateway
        strip_path: false
        paths:
          - /graphql/v1
        headers:
          x-project-ref:
            - ".+"
        regex_priority: 200
    plugins:
      - name: cors
        config:
          <<: *indobase_cors
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public

  ## Analytics routes
  ## Not used - Studio and Vector talk directly to analytics via Docker networking.
  ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
