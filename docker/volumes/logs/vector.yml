api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - indobase-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "default"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)
      del(.stream)
  router:
    type: route
    inputs:
      - project_logs
    route:
      kong: '.appname == "indobase-kong"'
      auth: '.appname == "indobase-auth"'
      rest: '.appname == "indobase-rest"'
      realtime: '.appname == "realtime-dev.indobase-realtime"'
      storage: '.appname == "indobase-storage"'
      functions: '.appname == "indobase-edge-functions"'
      db: '.appname == "indobase-db"'
  # Ignores non nginx errors since they are related with kong booting up
  kong_logs:
    type: remap
    inputs:
      - router.kong
    source: |-
      # Kong access logs use a custom format (see docker-compose) that appends:
      # `host=<...> x_project_ref=<...> rt=<...> urt=<...>`
      parsed, err = parse_regex(
        .event_message,
        r'^(?P<remote_addr>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<request>[^"]*)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)" host=(?P<host>\S+) x_project_ref=(?P<x_project_ref>\S+) rt=(?P<request_time>\S+) urt=(?P<upstream_response_time>\S+)$'
      )
      if err != null { abort }

      .timestamp = parse_timestamp!(value: parsed.time, format: "%d/%b/%Y:%H:%M:%S %z")
      .metadata.request.host = parsed.host
      .metadata.request.headers.referer = parsed.referer
      .metadata.request.headers.user_agent = parsed.user_agent
      .metadata.response.status_code = to_int!(parsed.status)
      .metadata.response.bytes_sent = to_int!(parsed.body_bytes_sent)
      # Nginx times are seconds (float). Upstream response time may be "-" on some responses.
      .metadata.response.request_time_s = to_float!(parsed.request_time)
      if parsed.upstream_response_time != "-" {
        .metadata.response.upstream_response_time_s = to_float!(parsed.upstream_response_time)
      }

      ._req_parts = split!(string!(parsed.request), " ")
      if length(._req_parts) >= 3 {
        .metadata.request.method = ._req_parts[0]
        .metadata.request.path = ._req_parts[1]
        .metadata.request.protocol = ._req_parts[2]
      }
      del(._req_parts)

      if parsed.x_project_ref != "-" && parsed.x_project_ref != "" {
        .metadata.project_ref = parsed.x_project_ref
      } else {
        host = string!(parsed.host)
        ._host_parts = split!(host, ".")
        if length(._host_parts) > 0 {
          reserved = ["api","dashboard","studio","auth","realtime","storage","functions","meta","kong"]
          if !includes(reserved, ._host_parts[0]) { .metadata.project_ref = ._host_parts[0] }
        }
        del(._host_parts)
      }

  usage_events:
    type: remap
    inputs:
      - kong_logs
    source: |-
      # Shape event keys to match `saas.usage_events` columns for Vector's `postgres` sink.
      .event_id = uuid_v4()
      .occurred_at = .timestamp
      .project_ref = string!(.metadata.project_ref)
      .host = string!(.metadata.request.host)
      .method = string!(.metadata.request.method)
      .path = string!(.metadata.request.path)
      .status_code = to_int(.metadata.response.status_code) ?? null
      .bytes_sent = to_int(.metadata.response.bytes_sent) ?? null
      .request_time_s = to_float(.metadata.response.request_time_s) ?? null
      .upstream_response_time_s = to_float(.metadata.response.upstream_response_time_s) ?? null
      .service = "kong"

      del(.metadata)
      del(.event_message)
      del(.appname)
      del(.project)
      del(.timestamp)
  # Ignores non nginx errors since they are related with kong booting up
  kong_err:
    type: remap
    inputs:
      - router.kong
    source: |-
      .metadata.request.method = "GET"
      .metadata.response.status_code = 200
      parsed, err = parse_nginx_log(.event_message, "error")
      if err == null {
          .timestamp = parsed.timestamp
          .severity = parsed.severity
          .metadata.request.host = parsed.host
          .metadata.request.headers.cf_connecting_ip = parsed.client
          host = string!(.metadata.request.host)
          ._host_parts = split!(host, ".")
          if length(._host_parts) > 0 {
            reserved = ["api","dashboard","studio","auth","realtime","storage","functions","meta","kong"]
            if !includes(reserved, ._host_parts[0]) { .metadata.project_ref = ._host_parts[0] }
          }
          del(._host_parts)
          ._req_parts = split!(string!(parsed.request), " ")
          if length(._req_parts) >= 3 {
              .metadata.request.method = ._req_parts[0]
              .metadata.request.path = ._req_parts[1]
              .metadata.request.protocol = ._req_parts[2]
          }
          del(._req_parts)
      }
      if err != null {
        abort
      }
  # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
  auth_logs:
    type: remap
    inputs:
      - router.auth
    source: |-
      parsed, err = parse_json(.event_message)
      if err == null {
          .metadata.timestamp = parsed.time
          .metadata = merge!(.metadata, parsed)
      }
  # PostgREST logs are structured so we separate timestamp from message using regex
  rest_logs:
    type: remap
    inputs:
      - router.rest
    source: |-
      parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .timestamp = parse_timestamp!(value: parsed.time,format: "%d/%b/%Y:%H:%M:%S %z")
          .metadata.host = .project
      }
  # Filter out healthcheck logs from Realtime
  realtime_logs_filtered:
    type: filter
    inputs:
      - router.realtime
    condition: '!contains(string!(.event_message), "/health")'
  # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
  realtime_logs:
    type: remap
    inputs:
      - realtime_logs_filtered
    source: |-
      .metadata.project = del(.project)
      .metadata.external_id = .metadata.project
      parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
      }
  # Function logs are unstructured messages on stderr
  functions_logs:
    type: remap
    inputs:
      - router.functions
    source: |-
      .metadata.project_ref = del(.project)
  # Storage logs may contain json objects so we parse them for completeness
  storage_logs:
    type: remap
    inputs:
      - router.storage
    source: |-
      .metadata.project = del(.project)
      .metadata.tenantId = .metadata.project
      parsed, err = parse_json(.event_message)
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
          .metadata.timestamp = parsed.time
          .metadata.context[0].host = parsed.hostname
          .metadata.context[0].pid = parsed.pid
      }
  # Postgres logs some messages to stderr which we map to warning severity level
  db_logs:
    type: remap
    inputs:
      - router.db
    source: |-
      .metadata.host = "db-default"
      .metadata.parsed.timestamp = .timestamp

      parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

      if err != null || parsed == null {
        .metadata.parsed.error_severity = "info"
      }
      if parsed.level != null {
       .metadata.parsed.error_severity = parsed.level
      }
      if .metadata.parsed.error_severity == "info" {
          .metadata.parsed.error_severity = "log"
      }
      .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

sinks:
  logflare_auth:
    type: 'http'
    inputs:
      - auth_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=gotrue.logs.prod'
  logflare_realtime:
    type: 'http'
    inputs:
      - realtime_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=realtime.logs.prod'
  logflare_rest:
    type: 'http'
    inputs:
      - rest_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=postgREST.logs.prod'
  logflare_db:
    type: 'http'
    inputs:
      - db_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    # Route directly to analytics like other sinks. Retry handles the startup
    # race where analytics may not be ready yet when early DB logs arrive.
    uri: 'http://analytics:4000/api/logs?source_name=postgres.logs'
  logflare_functions:
    type: 'http'
    inputs:
      - functions_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=deno-relay-logs'
  logflare_storage:
    type: 'http'
    inputs:
      - storage_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=storage.logs.prod.2'
  logflare_kong:
    type: 'http'
    inputs:
      - kong_logs
      - kong_err
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=cloudflare.logs.prod'

  postgres_usage_events:
    type: postgres
    inputs:
      - usage_events
    endpoint: ${USAGE_METERING_DB_URL?USAGE_METERING_DB_URL is required}
    table: saas.usage_events
    healthcheck:
      # In Dokploy/compose startups, Postgres may not be reachable yet when Vector starts.
      # If enabled, Vector can report unhealthy and block the whole stack.
      # The sink will still retry on failures; disabling healthcheck avoids deployment deadlocks.
      enabled: false
    batch:
      max_events: 5000
      timeout_secs: 1
