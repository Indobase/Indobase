<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You are invited to Indobase</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;">
          <tr>
            <td style="background:linear-gradient(135deg,#18181b 0%,#27272a 100%);padding:28px 32px;text-align:center;">
              <img src="https://studio.indobase.in/img/indobase-logo.svg" width="40" height="40" alt="Indobase" />
              <span style="display:inline-block;vertical-align:middle;margin-left:10px;font-size:22px;font-weight:700;color:#ffffff;">Indobase</span>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px;">
              <h1 style="margin:0 0 12px;font-size:24px;font-weight:700;">You are invited</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#52525b;">Accept the invitation to create your Indobase account.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 20px;">
                <tr>
                  <td style="border-radius:8px;background-color:#f0b429;">
                    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;redirect_to={{ .RedirectTo }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:600;color:#18181b;text-decoration:none;">Accept invitation</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px;font-size:14px;color:#71717a;">Your verification code:</p>
              <p style="margin:0;font-size:28px;font-weight:700;letter-spacing:0.25em;">{{ .Token }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
