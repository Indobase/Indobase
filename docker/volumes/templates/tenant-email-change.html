<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Confirm email change</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:12px;border:1px solid #e4e4e7;">
        <tr><td style="background:#18181b;padding:24px;text-align:center;color:#fff;font-size:20px;font-weight:700;">Indobase</td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 12px;font-size:22px;">Confirm email change</h1>
          <p style="margin:24px 0;"><a href="{{ .ConfirmationURL }}" style="background:#f0b429;color:#18181b;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;">Confirm new email</a></p>
          <p style="color:#71717a;font-size:14px;">Verification code: <strong style="font-size:22px;letter-spacing:0.2em;">{{ .Token }}</strong></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
