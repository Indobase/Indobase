# Traefik dynamic config: mcp.indobase.in → Studio /api/mcp
# Copy to VPS: /etc/dokploy/traefik/dynamic/mcp-indobase.yml
#
# Backend URL must match the live Studio Swarm service name on dokploy-network.
# indobase-studio-attach-compose-network.sh keeps this aligned when the timer runs.

http:
  middlewares:
    indobase-mcp-replace-path:
      replacePath:
        path: /api/mcp

  routers:
    indobase-mcp-router:
      rule: Host(`mcp.indobase.in`)
      service: indobase-mcp-service
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    indobase-mcp-router-websecure:
      rule: Host(`mcp.indobase.in`)
      service: indobase-mcp-service
      middlewares:
        - indobase-mcp-replace-path
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

  services:
    indobase-mcp-service:
      loadBalancer:
        servers:
          - url: http://indobase-studio-erpgp1:8080
        passHostHeader: true
