# Traefik dynamic config for https://builder.indobase.in
# Copy to /etc/dokploy/traefik/dynamic/builder-indobase.yml on the Vyom control-plane VPS.
# Requires DNS: builder.indobase.in -> 103.190.92.249 (Vyom .249).
# Backend Swarm service: indobase-builder (port 5173).
#
# Long-lived SSE (/api/chat) needs generous forwarding timeouts + flush so
# idle model/tool gaps are not closed as dead connections.

http:
  serversTransports:
    indobase-builder-long:
      forwardingTimeouts:
        dialTimeout: 30s
        # 0 = wait indefinitely for the first response byte (SSE chat streams).
        responseHeaderTimeout: 0s
        idleConnTimeout: 3600s
  routers:
    indobase-builder-http:
      rule: Host(`builder.indobase.in`)
      service: indobase-builder-svc
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    indobase-builder-https:
      rule: Host(`builder.indobase.in`)
      service: indobase-builder-svc
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    indobase-builder-svc:
      loadBalancer:
        serversTransport: indobase-builder-long
        responseForwarding:
          flushInterval: 1ms
        servers:
          - url: http://indobase-builder:5173
        passHostHeader: true
