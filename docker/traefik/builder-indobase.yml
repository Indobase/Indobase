# Traefik dynamic config for https://builder.indobase.in
# Copy to /etc/dokploy/traefik/dynamic/builder-indobase.yml on the Vyom control-plane VPS.
# Requires DNS: builder.indobase.in -> 103.190.92.249 (Vyom .249).
# Backend: Gen 3 CFOS bridge (indobase-builder-cfos:8791). Classic Remix Builder scaled to 0.
#
# Long-lived agent WebSocket (/api) + SSE need generous forwarding timeouts.

http:
  serversTransports:
    indobase-builder-long:
      forwardingTimeouts:
        dialTimeout: 30s
        # 0 = wait indefinitely for the first response byte (streams / WS upgrade).
        responseHeaderTimeout: 0s
        idleConnTimeout: 3600s
  routers:
    indobase-builder-http:
      rule: Host(`builder.indobase.in`)
      service: indobase-builder-svc
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    indobase-builder-https:
      rule: Host(`builder.indobase.in`)
      service: indobase-builder-svc
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    indobase-builder-svc:
      loadBalancer:
        serversTransport: indobase-builder-long
        responseForwarding:
          flushInterval: 1ms
        servers:
          - url: http://indobase-builder-cfos:8791
        passHostHeader: true
