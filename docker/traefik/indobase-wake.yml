# Wake-on-traffic for sleeping tenant stacks.
# Copy to /etc/dokploy/traefik/dynamic/indobase-wake.yml on the VPS.
#
# When a tenant stack is asleep (idle sleep / capacity valve), its API/site backends are down and
# Traefik gets a 502/503/504. The `indobase-wake` errors middleware catches those and serves the
# response from the provisioner wake-gate, which resumes the stack and returns a "starting up" page
# that auto-refreshes. Per-tenant routers (generated by tenant-traefik.mjs) reference this
# middleware, so it covers the isolated-stack API and site paths.
#
# The wake-gate is the provisioner's site-static-proxy (:8790), reached over the docker bridge the
# same way tenant services are addressed (TRAEFIK_UPSTREAM_HOST, default 172.17.0.1).

http:
  middlewares:
    indobase-wake:
      errors:
        status:
          - "502-504"
        service: indobase-wake-gate-svc
        # Path the wake-gate serves; original tenant host arrives in X-Forwarded-Host.
        query: "/__indobase_wake"

  services:
    indobase-wake-gate-svc:
      loadBalancer:
        servers:
          - url: http://172.17.0.1:8790
        passHostHeader: true
