# DEPRECATED — do not deploy. CFOS Builder is only at https://builder.indobase.in
# (see docker/traefik/builder-indobase.yml). builder-v2 was a temporary dual-hostname.
# Traefik dynamic config for https://builder-v2.indobase.in (retired).
# Backend was Swarm service indobase-builder-cfos (port 8791).

http:
  routers:
    indobase-builder-cfos-http:
      rule: Host(`builder-v2.indobase.in`)
      service: indobase-builder-cfos-svc
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    indobase-builder-cfos-https:
      rule: Host(`builder-v2.indobase.in`)
      service: indobase-builder-cfos-svc
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: builder-v2.indobase.in

  services:
    indobase-builder-cfos-svc:
      loadBalancer:
        servers:
          - url: http://indobase-builder-cfos:8791
        passHostHeader: true
