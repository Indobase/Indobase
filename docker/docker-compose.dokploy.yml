# Optional Dokploy overlay — use with the main compose file on the VPS:
#   docker compose -f docker-compose.yml -f docker-compose.dokploy.yml ...
#
# Traefik router labels are injected by Dokploy per application; this file only
# attaches services to the external dokploy-network Traefik uses.

services:
  kong:
    networks:
      - dokploy-network
      - default

  data-plane-provisioner:
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
