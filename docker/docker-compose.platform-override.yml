# Platform VPS: provisioner runs on backend (248); drop compose dependency on local provisioner.
services:
  studio:
    depends_on: !override
      analytics:
        condition: service_healthy
      db:
        condition: service_healthy
      kong:
        condition: service_started
      meta:
        condition: service_started
      functions:
        condition: service_started
  kong:
    environment:
      KONG_NGINX_HTTP_LOG_FORMAT: >-
        indobase_combined '$$remote_addr - $$remote_user [$$time_local] "$$request" $$status $$body_bytes_sent
        "$$http_referer" "$$http_user_agent" host=$$host x_project_ref=$$http_x_project_ref rt=$$request_time urt=$$upstream_response_time'
    volumes:
      - ./scripts/kong-entrypoint-vyom.sh:/kong-entrypoint-vyom.sh:ro
    entrypoint: ["/bin/bash", "/kong-entrypoint-vyom.sh"]
