# Vyom backend VPS overlay (103.190.92.248).
# Customer tenant stacks + provisioner only. Traefik installed via install-backend-traefik.sh.
#
# docker compose -f docker-compose.yml -f docker-compose.backend-vps.yml up -d data-plane-provisioner
services:
  data-plane-provisioner:
    ports:
      - "8787:8787"
      - "${SITE_STATIC_PROXY_PORT:-8790}:${SITE_STATIC_PROXY_PORT:-8790}"
    environment:
      TRAEFIK_UPSTREAM_HOST: ${TRAEFIK_UPSTREAM_HOST:-172.17.0.1}
      PROVISIONER_PUBLISH_HOST: ${PROVISIONER_PUBLISH_HOST:-172.17.0.1}
      PROVISIONER_TRAEFIK_DYNAMIC_DIR: /mnt/traefik
      SITE_STATIC_PROXY_ENABLED: ${SITE_STATIC_PROXY_ENABLED:-false}
      SITE_STATIC_PROXY_PORT: ${SITE_STATIC_PROXY_PORT:-8790}
      # Platform Postgres lives on control-plane VPS (.249); use TCP psql instead of local docker exec.
      PROVISIONER_PG_HOST: ${PROVISIONER_PG_HOST:-103.190.92.249}
      PROVISIONER_PG_PORT: ${PROVISIONER_PG_PORT:-5433}
      PROVISIONER_PG_REMOTE_PORT: ${PROVISIONER_PG_REMOTE_PORT:-5433}
      PROVISIONER_TENANT_DOCKER_NETWORK: ${PROVISIONER_TENANT_DOCKER_NETWORK:-indobase-backend-bmqhan_default}
      PROVISIONER_DB_CONTAINER: ${PROVISIONER_DB_CONTAINER:-}
      SAAS_DATA_PLANE_AUX_ROLE_PASSWORD: ${SAAS_DATA_PLANE_AUX_ROLE_PASSWORD:-}
    volumes:
      - ${TRAEFIK_DYNAMIC_DIR:-/etc/dokploy/traefik/dynamic}:/mnt/traefik:Z
      - ${PROVISIONER_TENANTS_HOST_DIR:-/var/lib/indobase/tenants}:/mnt/tenants:Z
      - /var/run/docker.sock:/var/run/docker.sock

  # Not used on backend VPS (no Studio/Kong customer gateway here).
  studio:
    profiles: ["never"]
  kong:
    profiles: ["never"]
  tenant-multiplexer:
    profiles: ["never"]
