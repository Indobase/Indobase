name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy built images to Dokploy / production (off unless you explicitly enable this)'
        required: true
        type: boolean
        default: false

# Latest push wins: cancel older runs so builds for superseded commits don’t pile up.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: roshanraghavander/ind-repo
  DOCKERHUB_PROVISIONER_REPO: roshanraghavander/ind-repo-provisioner
  DOCKERHUB_BUILDER_REPO: roshanraghavander/indobase-builder
  DOCKERHUB_BUILDER_CFOS_REPO: roshanraghavander/indobase-builder-cfos
  DOCKERHUB_WEBSITE_REPO: roshanraghavander/indobase-website
  SKIP_ASSET_UPLOAD: "1"
  NEXT_PUBLIC_INDOBASE_SAAS: "true"
  NEXT_PUBLIC_GOTRUE_URL: "https://api.indobase.in/auth/v1"
  NEXT_PUBLIC_SITE_URL: "https://studio.indobase.in"
  NEXT_PUBLIC_API_URL: "https://api.indobase.in"
  NEXT_PUBLIC_SUPABASE_URL: "https://api.indobase.in"
  NEXT_PUBLIC_GITHUB_INTEGRATION_CLIENT_ID: "Ov23lirKpb4l9ntem8Ej"
  NEXT_PUBLIC_GITHUB_INTEGRATION_APP_NAME: "indobase-studio"
  # Set after registering the Vercel Integration (see VERCEL_INTEGRATION_SETUP_GUIDE.md)
  NEXT_PUBLIC_VERCEL_INTEGRATION_URL: "https://vercel.com/integrations/indobase"
  NEXT_PUBLIC_RAZORPAY_BILLING: "true"
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  NEXT_PUBLIC_POSTHOG_UI_HOST: "https://us.posthog.com"
  # Public browser DSN (Indobase org / studio). Safe in client bundles.
  NEXT_PUBLIC_SENTRY_DSN: "https://5e95fe101ad06f3ca3b01808f9c76bae@o4511846637240320.ingest.us.sentry.io/4511846642745344"
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: "production"
  PUBLIC_SENTRY_DSN: "https://d3f99d6a5d06ce5b38b91f63585fe93a@o4511846637240320.ingest.us.sentry.io/4511846714048513"
  # Live /docs is apps/www — set on website Swarm as runtime PUBLIC_SENTRY_DSN_DOCS.
  PUBLIC_SENTRY_DSN_DOCS: "https://03c08fb6f7a0f5d1ee76d61072439f5a@o4511846637240320.ingest.us.sentry.io/4511846714048512"
  PUBLIC_SENTRY_ENVIRONMENT: "production"
  VITE_SENTRY_DSN: "https://4ae0d2d42c0ec4bdd71f78058194e665@o4511846637240320.ingest.us.sentry.io/4511846713982976"

jobs:
  # Fast gate — fail early before burning parallel build minutes.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit rebrand (Phase A gate)
        run: bash scripts/audit-no-supabase.sh

  # Parallel image builds (separate runners) so CFOS/www are not blocked by classic Builder.
  build-studio:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h /
      - name: Add swap for Studio Next build
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Build and push Studio (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            SKIP_ASSET_UPLOAD=${{ env.SKIP_ASSET_UPLOAD }}
            NODE_MAX_OLD_SPACE_SIZE=7168
            NEXT_PUBLIC_INDOBASE_SAAS=${{ env.NEXT_PUBLIC_INDOBASE_SAAS }}
            NEXT_PUBLIC_GOTRUE_URL=${{ env.NEXT_PUBLIC_GOTRUE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GITHUB_INTEGRATION_CLIENT_ID=${{ env.NEXT_PUBLIC_GITHUB_INTEGRATION_CLIENT_ID }}
            NEXT_PUBLIC_GITHUB_INTEGRATION_APP_NAME=${{ env.NEXT_PUBLIC_GITHUB_INTEGRATION_APP_NAME }}
            NEXT_PUBLIC_VERCEL_INTEGRATION_URL=${{ env.NEXT_PUBLIC_VERCEL_INTEGRATION_URL }}
            NEXT_PUBLIC_RAZORPAY_BILLING=${{ env.NEXT_PUBLIC_RAZORPAY_BILLING }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_PROJECT_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_UI_HOST=${{ env.NEXT_PUBLIC_POSTHOG_UI_HOST }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ env.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=ind-repo-v7
          cache-to: type=gha,mode=max,scope=ind-repo-v7

  build-provisioner:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push provisioner (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/provisioner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_PROVISIONER_REPO }}:latest
            ${{ env.DOCKERHUB_PROVISIONER_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=ind-repo-provisioner-v1
          cache-to: type=gha,mode=max,scope=ind-repo-provisioner-v1

  build-builder:
    needs: audit
    # Classic Builder is optional for CFOS prod — do not fail the whole workflow if it breaks.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /
      - name: Build and push classic Builder (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./indobase-builder/Dockerfile
          platforms: linux/amd64
          target: bolt-ai-production
          build-args: |
            BUILD_NODE_OPTIONS=--max-old-space-size=4096
            VITE_SUPABASE_URL=${{ env.NEXT_PUBLIC_API_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=${{ github.sha }}
            VITE_GIT_BRANCH=${{ github.ref_name }}
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_BUILDER_REPO }}:latest
            ${{ env.DOCKERHUB_BUILDER_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=indobase-builder-v2
          cache-to: type=gha,mode=max,scope=indobase-builder-v2

  build-builder-cfos:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Builder CFOS (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./indobase-builder-cfos/Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_BUILDER_CFOS_REPO }}:latest
            ${{ env.DOCKERHUB_BUILDER_CFOS_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=indobase-builder-cfos-v1
          cache-to: type=gha,mode=max,scope=indobase-builder-cfos-v1

  build-website:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Website (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/www/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_WEBSITE_REPO }}:latest
            ${{ env.DOCKERHUB_WEBSITE_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=indobase-website-v1
          cache-to: type=gha,mode=max,scope=indobase-website-v1

  # Aggregate status for summary; deploy waits on the critical prod images.
  build:
    needs: [build-studio, build-provisioner, build-builder, build-builder-cfos, build-website]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Require prod-critical images
        run: |
          set -euo pipefail
          echo "studio=${{ needs.build-studio.result }}"
          echo "provisioner=${{ needs.build-provisioner.result }}"
          echo "builder=${{ needs.build-builder.result }}"
          echo "cfos=${{ needs.build-builder-cfos.result }}"
          echo "website=${{ needs.build-website.result }}"
          # Prod agentic path: Studio + CFOS + www must succeed. Classic Builder is best-effort.
          test "${{ needs.build-studio.result }}" = "success"
          test "${{ needs.build-builder-cfos.result }}" = "success"
          test "${{ needs.build-website.result }}" = "success"
          test "${{ needs.build-provisioner.result }}" = "success"
          if [ "${{ needs.build-builder.result }}" != "success" ]; then
            echo "::warning::Classic Builder image failed — CFOS/Studio/www still published. Fix indobase-builder Dockerfile if classic is needed."
          fi
      - name: Verify Hub tags (critical)
        run: |
          set -euo pipefail
          for img in \
            "${{ env.DOCKERHUB_REPO }}:${{ github.sha }}" \
            "${{ env.DOCKERHUB_PROVISIONER_REPO }}:${{ github.sha }}" \
            "${{ env.DOCKERHUB_BUILDER_CFOS_REPO }}:${{ github.sha }}" \
            "${{ env.DOCKERHUB_WEBSITE_REPO }}:${{ github.sha }}"; do
            echo "inspect $img"
            docker buildx imagetools inspect "$img"
          done
          if docker buildx imagetools inspect "${{ env.DOCKERHUB_BUILDER_REPO }}:${{ github.sha }}"; then
            echo "classic builder tag ok"
          else
            echo "::warning::classic builder tag missing"
          fi
      - name: Build summary
        if: always()
        run: |
          echo "## Docker build (parallel)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Studio:** ${{ needs.build-studio.result }} — \`${{ env.DOCKERHUB_REPO }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Provisioner:** ${{ needs.build-provisioner.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Builder CFOS:** ${{ needs.build-builder-cfos.result }} — \`${{ env.DOCKERHUB_BUILDER_CFOS_REPO }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Website:** ${{ needs.build-website.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Classic Builder:** ${{ needs.build-builder.result }} (non-blocking for CFOS prod)" >> "$GITHUB_STEP_SUMMARY"

  # Manual rollout only: never deploy on push. Run workflow_dispatch with deploy=true.
  # Skipped steps (missing secrets) exit 0; webhook failures only warn. Smoke test is best-effort.
  # Depends on aggregate `build` (critical images only) so classic Builder failure does not block deploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && needs.build.result == 'success'
    steps:
      - name: Trigger Dokploy deploy (Git webhook payload)
        id: dokploy_webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK not set — redeploy manually in Dokploy. See docker/DOKPLOY-STUDIO-DEPLOY.md"
            exit 0
          fi
          # Dokploy Git webhooks expect a push payload with matching ref (else "Branch Not Match").
          payload="$(jq -n \
            --arg ref "${GITHUB_REF}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg name "${GITHUB_REPOSITORY#*/}" \
            '{
              ref: $ref,
              repository: {
                full_name: $repo,
                name: $name,
                clone_url: ("https://github.com/" + $repo + ".git")
              }
            }')"
          ok=0
          for attempt in 1 2 3; do
            echo "Dokploy webhook attempt $attempt (ref=${GITHUB_REF})"
            http_code="$(curl -sS -o /tmp/dokploy-webhook.out -w '%{http_code}' \
              -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: push' \
              -d "$payload" || true)"
            echo "HTTP $http_code"
            head -c 2000 /tmp/dokploy-webhook.out || true
            echo ""
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Dokploy Git webhook failed — see deploy logs in Dokploy UI."
            cat /tmp/dokploy-webhook.out 2>/dev/null || true
            echo "For Compose stacks prefer DOKPLOY_COMPOSE_ID + API (see docker/DOKPLOY-STUDIO-DEPLOY.md)"
          fi

      # Preferred for Dokploy Docker Compose: avoids Git webhook redeploying the whole stack.
      - name: Deploy via Dokploy Compose API
        id: dokploy_compose
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Skipping compose.deploy (set DOKPLOY_API_URL, DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID)"
            exit 0
          fi
          base="${DOKPLOY_API_URL%/}"
          echo "Triggering compose.deploy for $DOKPLOY_COMPOSE_ID"
          curl -fsS -X POST "$base/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "$(jq -n \
              --arg id "$DOKPLOY_COMPOSE_ID" \
              --arg sha "${{ github.sha }}" \
              '{
                composeId: $id,
                title: "GitHub Actions",
                description: ("Deploy commit " + $sha)
              }')"

      - name: Deploy via Dokploy Application API
        id: dokploy_api
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
        run: |
          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::notice::Skipping application.deploy (set DOKPLOY_API_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID)"
            exit 0
          fi
          base="${DOKPLOY_API_URL%/}"
          curl -fsS -X POST "$base/api/application.update" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"dockerImage\":\"$IMAGE\"}"
          curl -fsS -X POST "$base/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"

      # Backend Compose + Studio Application: patch STUDIO_PG_META_URL to host-published meta port.
      - name: Patch Studio split-deploy env (Dokploy API)
        id: dokploy_studio_split
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          PG_META_PUBLISH_PORT: ${{ secrets.PG_META_PUBLISH_PORT }}
          DOCKER_GATEWAY_IP: ${{ secrets.DOCKER_GATEWAY_IP }}
          SUPABASE_PUBLIC_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::notice::Skipping split Studio env patch (set DOKPLOY_API_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID)"
            exit 0
          fi
          chmod +x docker/scripts/dokploy-studio-split-env.sh
          docker/scripts/dokploy-studio-split-env.sh

      # Liveness only (no postgres-meta). Readiness is /api/health (may be 503 when meta/env is wrong).
      - name: Smoke test — prod /api/health/live version
        id: prod_smoke
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
          LIVE_URL: https://studio.indobase.in/api/health/live
          READINESS_URL: https://studio.indobase.in/api/health
        run: |
          ok=0
          for i in $(seq 1 12); do
            http_code="$(curl -sS -o /tmp/health-live.json -w '%{http_code}' --max-time 10 "$LIVE_URL" 2>/dev/null || echo 000)"
            version="$(jq -r '.version // empty' /tmp/health-live.json 2>/dev/null || true)"
            if [ "$http_code" = "200" ] && [ "$version" = "$EXPECTED_SHA" ]; then
              echo "✅ prod liveness is commit $version (attempt $i)"
              ok=1
              break
            fi
            echo "attempt $i: live http=${http_code} version=${version:-<none>} (want $EXPECTED_SHA)"
            head -c 300 /tmp/health-live.json 2>/dev/null || true
            echo ""
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Prod not on $EXPECTED_SHA yet — pull roshanraghavander/ind-repo:latest and redeploy Studio in Dokploy (see docker/DOKPLOY-STUDIO-DEPLOY.md)"
            exit 1
          fi
          readiness_code="$(curl -sS -o /tmp/health-ready.json -w '%{http_code}' --max-time 10 "$READINESS_URL" 2>/dev/null || echo 000)"
          readiness_status="$(jq -r '.status // empty' /tmp/health-ready.json 2>/dev/null || true)"
          echo "readiness http=${readiness_code} status=${readiness_status:-<not-json>}"
          jq -c '.checks.saasInfra // empty' /tmp/health-ready.json 2>/dev/null || head -c 200 /tmp/health-ready.json || true
          echo ""
          if [ "$readiness_code" != "200" ]; then
            echo "::warning::Readiness degraded — fix STUDIO_PG_META_URL / PG_META_CRYPTO_KEY / Docker network (studio must reach indobase-meta:8080)"
          fi

      - name: Post-deploy — attach Studio to compose network (VPS)
        if: steps.prod_smoke.outcome == 'success'
        continue-on-error: true
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          KEY="${VPS_SSH_KEY:-}"
          if [ -z "$KEY" ]; then
            echo "::notice::Skipping VPS attach (set VPS_SSH_KEY secret for automatic postgres-meta network fix)"
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -o StrictHostKeyChecking=accept-new -i "$KEY_FILE" root@103.190.92.249 \
            '/usr/local/bin/indobase-studio-attach-compose-network.sh'

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy (optional)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.dokploy_compose.outcome }}" = "success" ]; then
            echo "- **Dokploy compose.deploy:** ✅" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.DOKPLOY_COMPOSE_ID }}" ]; then
            echo "- **Dokploy compose.deploy:** ⚠️ failed — check Dokploy compose logs" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.dokploy_webhook.outcome }}" = "success" ]; then
            echo "- **Dokploy Git webhook:** ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Dokploy Git webhook:** ⚠️ skipped or failed (use compose.deploy API for Compose stacks)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.prod_smoke.outcome }}" = "success" ]; then
            echo "- **Prod:** ✅ on commit \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Prod:** ⚠️ still on old image — manual redeploy in Dokploy" >> "$GITHUB_STEP_SUMMARY"
          fi
