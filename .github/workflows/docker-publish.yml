name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKERHUB_REPO: roshanraghavander/ind-repo
  SKIP_ASSET_UPLOAD: "1"
  NEXT_PUBLIC_INDOBASE_SAAS: "true"
  NEXT_PUBLIC_GOTRUE_URL: "https://api.indobase.in/auth/v1"
  NEXT_PUBLIC_SITE_URL: "https://studio.indobase.in"
  NEXT_PUBLIC_API_URL: "https://api.indobase.in"
  NEXT_PUBLIC_SUPABASE_URL: "https://api.indobase.in"

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64 for Dokploy)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            SKIP_ASSET_UPLOAD=${{ env.SKIP_ASSET_UPLOAD }}
            NEXT_PUBLIC_INDOBASE_SAAS=${{ env.NEXT_PUBLIC_INDOBASE_SAAS }}
            NEXT_PUBLIC_GOTRUE_URL=${{ env.NEXT_PUBLIC_GOTRUE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=ind-repo-v2
          cache-to: type=gha,mode=max,scope=ind-repo-v2

      - name: Verify image on Docker Hub
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          docker buildx imagetools inspect "${{ env.DOCKERHUB_REPO }}:${{ github.sha }}"
          docker buildx imagetools inspect "${{ env.DOCKERHUB_REPO }}:latest"

      # Tell Dokploy to redeploy the studio service. Webhook URL is set up in Dokploy
      # under the Studio app → Deployments → "Deploy Webhook" and saved as a repo secret.
      # Without this step, the new image sits on Docker Hub until someone manually redeploys.
      # See docker/DOKPLOY-STUDIO-DEPLOY.md if prod stays on an old /api/health version.
      - name: Trigger Dokploy deploy
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret is not set. Add it from Dokploy → Studio → Deployments → Deploy Webhook. See docker/DOKPLOY-STUDIO-DEPLOY.md"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Dokploy webhook attempt $attempt"
            http_code="$(curl -sS -o /tmp/dokploy-webhook.out -w '%{http_code}' -X POST "$DOKPLOY_DEPLOY_WEBHOOK" || true)"
            echo "HTTP $http_code"
            head -c 2000 /tmp/dokploy-webhook.out || true
            echo ""
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dokploy deploy webhook failed after 3 attempts (last HTTP $http_code)"
              exit 1
            fi
            sleep 15
          done

      # Optional: pin Dokploy Application image to this commit SHA (avoids stale :latest on the host).
      - name: Deploy via Dokploy API
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOKPLOY_API_URL != '' && secrets.DOKPLOY_API_KEY != '' && secrets.DOKPLOY_APPLICATION_ID != '' }}
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
        run: |
          base="${DOKPLOY_API_URL%/}"
          echo "Updating application image to $IMAGE"
          curl -fsS -X POST "$base/api/application.update" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"dockerImage\":\"$IMAGE\"}"
          echo "Triggering application.deploy"
          curl -fsS -X POST "$base/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"

      # Poll prod /api/health.version until it equals this commit. Catches the whole class
      # of "deploy reported success but old code is still being served" bugs (stale image,
      # buildx cache poisoning, Dokploy didn't recreate the container, etc).
      - name: Smoke test — confirm prod is on this commit
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://studio.indobase.in/api/health
        run: |
          # Use -sS (not -fsS): /api/health returns 503 when degraded, but the body still
          # carries `version`. We care about identity (which commit is running), not health.
          for i in $(seq 1 60); do
            body="$(curl -sS --max-time 10 "$HEALTH_URL" || true)"
            version="$(printf '%s' "$body" | sed -nE 's/.*"version":"([^"]+)".*/\1/p')"
            if [ "$version" = "$EXPECTED_SHA" ]; then
              echo "✅ prod is serving $version after ${i} attempts"
              exit 0
            fi
            echo "attempt $i: prod version=${version:-<none>} (want $EXPECTED_SHA)"
            sleep 10
          done
          echo "::error::prod did not pick up commit $EXPECTED_SHA after 10 minutes"
          echo "Last response from $HEALTH_URL:"
          curl -sS "$HEALTH_URL" || true
          echo ""
          echo "::error::Dokploy did not redeploy the new image. Fix in Dokploy UI:"
          echo "  1. Image must be roshanraghavander/ind-repo:latest (not a pinned old SHA)"
          echo "  2. STUDIO_DOCKER_IMAGE=roshanraghavander/ind-repo:latest for Compose deploys"
          echo "  3. Confirm DOKPLOY_DEPLOY_WEBHOOK is the Studio app deploy URL; check Deployments tab for a new run"
          echo "  4. Manually click Deploy, then re-run this workflow"
          echo "See docker/DOKPLOY-STUDIO-DEPLOY.md"
          exit 1
