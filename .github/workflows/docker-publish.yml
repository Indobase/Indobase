name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKERHUB_REPO: roshanraghavander/ind-repo
  SKIP_ASSET_UPLOAD: "1"
  NEXT_PUBLIC_INDOBASE_SAAS: "true"
  NEXT_PUBLIC_GOTRUE_URL: "https://api.indobase.in/auth/v1"
  NEXT_PUBLIC_SITE_URL: "https://studio.indobase.in"
  NEXT_PUBLIC_API_URL: "https://api.indobase.in"
  NEXT_PUBLIC_SUPABASE_URL: "https://api.indobase.in"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64 for Dokploy)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            SKIP_ASSET_UPLOAD=${{ env.SKIP_ASSET_UPLOAD }}
            NEXT_PUBLIC_INDOBASE_SAAS=${{ env.NEXT_PUBLIC_INDOBASE_SAAS }}
            NEXT_PUBLIC_GOTRUE_URL=${{ env.NEXT_PUBLIC_GOTRUE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          # v3 scope: avoid reusing a poisoned build-studio layer from older cache entries
          cache-from: type=gha,scope=ind-repo-v3
          cache-to: type=gha,mode=max,scope=ind-repo-v3

      - name: Verify image on Docker Hub
        run: |
          docker buildx imagetools inspect "${{ env.DOCKERHUB_REPO }}:${{ github.sha }}"
          docker buildx imagetools inspect "${{ env.DOCKERHUB_REPO }}:latest"

      - name: Build summary
        run: |
          echo "## Docker build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ env.DOCKERHUB_REPO }}:${{ github.sha }}\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"

  # Optional rollout — never fails the workflow (build job is the required gate).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Dokploy deploy (Git webhook payload)
        id: dokploy_webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK not set — redeploy manually in Dokploy. See docker/DOKPLOY-STUDIO-DEPLOY.md"
            exit 0
          fi
          # Dokploy Git webhooks expect a push payload with matching ref (else "Branch Not Match").
          payload="$(jq -n \
            --arg ref "${GITHUB_REF}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg name "${GITHUB_REPOSITORY#*/}" \
            '{
              ref: $ref,
              repository: {
                full_name: $repo,
                name: $name,
                clone_url: ("https://github.com/" + $repo + ".git")
              }
            }')"
          ok=0
          for attempt in 1 2 3; do
            echo "Dokploy webhook attempt $attempt (ref=${GITHUB_REF})"
            http_code="$(curl -sS -o /tmp/dokploy-webhook.out -w '%{http_code}' \
              -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: push' \
              -d "$payload" || true)"
            echo "HTTP $http_code"
            head -c 2000 /tmp/dokploy-webhook.out || true
            echo ""
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Dokploy webhook failed (Branch Not Match? Set Dokploy branch to main, or use Docker-image app + Docker Hub webhook). See docker/DOKPLOY-STUDIO-DEPLOY.md"
            exit 1
          fi

      - name: Deploy via Dokploy API
        id: dokploy_api
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
        run: |
          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::notice::Skipping Dokploy API (set DOKPLOY_API_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID)"
            exit 0
          fi
          base="${DOKPLOY_API_URL%/}"
          curl -fsS -X POST "$base/api/application.update" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"dockerImage\":\"$IMAGE\"}"
          curl -fsS -X POST "$base/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"

      - name: Smoke test — prod /api/health version
        id: prod_smoke
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://studio.indobase.in/api/health
        run: |
          for i in $(seq 1 12); do
            body="$(curl -sS --max-time 10 "$HEALTH_URL" || true)"
            version="$(printf '%s' "$body" | sed -nE 's/.*"version":"([^"]+)".*/\1/p')"
            if [ "$version" = "$EXPECTED_SHA" ]; then
              echo "✅ prod is serving $version after ${i} attempts"
              exit 0
            fi
            echo "attempt $i: prod version=${version:-<none>} (want $EXPECTED_SHA)"
            sleep 10
          done
          echo "::warning::prod not on $EXPECTED_SHA yet — image is on Docker Hub; redeploy Dokploy (roshanraghavander/ind-repo:latest)"
          curl -sS "$HEALTH_URL" || true
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy (optional)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.dokploy_webhook.outcome }}" = "success" ]; then
            echo "- **Dokploy webhook:** ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Dokploy webhook:** ⚠️ failed — set Dokploy branch to \`main\` or use Docker Hub → Dokploy webhook" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.prod_smoke.outcome }}" = "success" ]; then
            echo "- **Prod:** ✅ on commit \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Prod:** ⚠️ still on old image — manual redeploy in Dokploy" >> "$GITHUB_STEP_SUMMARY"
          fi
