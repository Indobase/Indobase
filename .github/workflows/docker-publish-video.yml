name: Build and Push Indobase Video

# Separate from docker-publish.yml so Studio/Builder concurrency cancels do not
# abort the Video image (Video was last in a long sequential job and rarely finished).
on:
  push:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: docker-publish-video-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_VIDEO_REPO: roshanraghavander/indobase-video

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Indobase Video (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./indobase-video
          file: ./indobase-video/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_VIDEO_REPO }}:latest
            ${{ env.DOCKERHUB_VIDEO_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=indobase-video-v1
          cache-to: type=gha,mode=max,scope=indobase-video-v1

      - name: Verify image on Docker Hub
        run: |
          docker buildx imagetools inspect "${{ env.DOCKERHUB_VIDEO_REPO }}:${{ github.sha }}"
          docker buildx imagetools inspect "${{ env.DOCKERHUB_VIDEO_REPO }}:latest"

      - name: Build summary
        run: |
          echo "## Indobase Video" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ env.DOCKERHUB_VIDEO_REPO }}:${{ github.sha }}\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
