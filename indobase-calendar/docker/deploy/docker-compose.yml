# Indobase Calendar — scheduling engine + SSO bridge (Vyom .249)
#
# Hosts:
#   prod:    calendar.indobase.in
#   staging: calendar.indobase.fun
#
# Traefik hits the bridge (:8095). Bridge handles Studio SSO and proxies
# the scheduling app. Upstream engine is invisible to customers.

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  calendar_postgres_data:
  calendar_redis_data:

networks:
  calendar_net:
    name: indobase-calendar
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-calendar

services:
  calendar-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CALENDAR_POSTGRES_USER:-indobase_calendar}
      POSTGRES_PASSWORD: ${CALENDAR_POSTGRES_PASSWORD:?set CALENDAR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CALENDAR_POSTGRES_DB:-indobase_calendar}
    volumes:
      - calendar_postgres_data:/var/lib/postgresql/data
    networks:
      - calendar_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-indobase_calendar} -d $${POSTGRES_DB:-indobase_calendar}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  calendar-redis:
    <<: *restart
    image: redis:7-alpine
    volumes:
      - calendar_redis_data:/data
    networks:
      - calendar_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    logging: *logging

  calendar-app:
    <<: *restart
    # Official community self-host image (MIT). Pin a tag in production.
    image: ${CALENDAR_IMAGE:-calcom/cal.com:v6.2.0}
    depends_on:
      calendar-db:
        condition: service_healthy
      calendar-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${CALENDAR_POSTGRES_USER:-indobase_calendar}:${CALENDAR_POSTGRES_PASSWORD}@calendar-db:5432/${CALENDAR_POSTGRES_DB:-indobase_calendar}
      DATABASE_DIRECT_URL: postgresql://${CALENDAR_POSTGRES_USER:-indobase_calendar}:${CALENDAR_POSTGRES_PASSWORD}@calendar-db:5432/${CALENDAR_POSTGRES_DB:-indobase_calendar}
      # Public URL is the bridge host — customers never hit the engine directly.
      NEXT_PUBLIC_WEBAPP_URL: ${CALENDAR_PUBLIC_URL:-https://calendar.indobase.in}
      NEXTAUTH_URL: ${CALENDAR_PUBLIC_URL:-https://calendar.indobase.in}/api/auth
      NEXTAUTH_SECRET: ${CALENDAR_NEXTAUTH_SECRET:?set CALENDAR_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY:?set CALENDAR_ENCRYPTION_KEY}
      CALCOM_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LICENSE_CONSENT: "true"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${CALENDAR_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${CALENDAR_VAPID_PRIVATE_KEY:-}
      REDIS_URL: redis://calendar-redis:6379
      NODE_TLS_REJECT_UNAUTHORIZED: ${CALENDAR_NODE_TLS_REJECT_UNAUTHORIZED:-0}
    networks:
      - calendar_net
    # Engine stays on the private network — Traefik routes to the bridge only.
    logging: *logging

  calendar-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      - calendar-app
    environment:
      PORT: "8095"
      CALENDAR_HANDOFF_SECRET: ${CALENDAR_HANDOFF_SECRET:?set CALENDAR_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      CALENDAR_APP_URL: http://calendar-app:3000
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-https://calendar.indobase.in}
      MEET_PUBLIC_URL: ${MEET_PUBLIC_URL:-https://meet.indobase.in}
      CALENDAR_MEET_AUTO_ATTACH: ${CALENDAR_MEET_AUTO_ATTACH:-1}
      CALENDAR_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    networks:
      - calendar_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-calendar.rule=${CALENDAR_TRAEFIK_RULE:-Host(`calendar.indobase.in`) || Host(`calendar.indobase.fun`)}
      - traefik.http.routers.indobase-calendar.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-calendar.tls=true
      - traefik.http.routers.indobase-calendar.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-calendar.priority=100
      - traefik.http.services.indobase-calendar.loadbalancer.server.port=8095
    logging: *logging
