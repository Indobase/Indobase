# Indobase Calendar — Traefik file provider (optional if compose labels suffice)
#
# DNS:
#   calendar.indobase.fun → staging
#   calendar.indobase.in  → Vyom 103.190.92.249
#
# Public edge is the SSO bridge (:8095), which proxies the scheduling engine.

http:
  routers:
    indobase-calendar:
      rule: Host(`calendar.indobase.in`) || Host(`calendar.indobase.fun`)
      entryPoints:
        - websecure
      service: indobase-calendar
      tls:
        certResolver: letsencrypt
        domains:
          - main: calendar.indobase.in
            sans:
              - calendar.indobase.fun

  services:
    indobase-calendar:
      loadBalancer:
        servers:
          - url: http://calendar-bridge:8095
