# Indobase Email — production / staging Compose
#
# Usage (SHA-pinned Hub image — required for staging/prod):
#   cp .env.example .env
#   # set secrets + INDOBASE_EMAIL_IMAGE=roshanraghavander/indobase-email:<git-sha>
#   docker compose -f docker-compose.yml --env-file .env pull
#   docker compose -f docker-compose.yml --env-file .env up -d
#
# Local image (after `docker build -t indobase-email:local ../..`):
#   INDOBASE_EMAIL_IMAGE=indobase-email:local docker compose ... up -d
#
# TLS: Traefik labels assume Dokploy Traefik (`dokploy-network`, cert resolver
# `letsencrypt`). Override TRAEFIK_NETWORK / EMAIL_HOST as needed.
#
# Hosts:
#   staging: email.indobase.fun → Hostinger 72.61.242.251 (or Vyom if preferred)
#   prod:    email.indobase.in  → Vyom 103.190.92.249
#
# CI publishes: roshanraghavander/indobase-email:<git-sha> (and :latest)
# via .github/workflows/docker-publish.yml on push to staging/main.

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

x-restart: &restart
  restart: unless-stopped

volumes:
  email_pg_data:
  email_app_data:

networks:
  indobase_email_net:
    name: indobase-email
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-email

services:
  email-db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - email_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - indobase_email_net
    logging: *logging

  email-api:
    <<: *restart
    # SHA-pinned Hub tag from CI (do not use unpinned :latest in prod).
    image: ${INDOBASE_EMAIL_IMAGE:?set INDOBASE_EMAIL_IMAGE=roshanraghavander/indobase-email:<git-sha>}
    depends_on:
      email-db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: email-db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_PREFIX: ${DB_PREFIX:-indobase_email}
      DB_NAME: ${DB_NAME:-indobase_email_system}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ROOT_EMAIL: ${ROOT_EMAIL:-}
      API_ENDPOINT: ${API_ENDPOINT:-https://email.indobase.in}
      STUDIO_HANDOFF_SECRET: ${STUDIO_HANDOFF_SECRET:?set STUDIO_HANDOFF_SECRET}
      EMAIL_HANDOFF_SECRET: ${EMAIL_HANDOFF_SECRET:-}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      STUDIO_HANDOFF_ONLY: ${STUDIO_HANDOFF_ONLY:-true}
      # System transactional SMTP (app emails). Empty until operator fills .env —
      # recommended: Amazon SES SMTP email-smtp.ap-south-1.amazonaws.com (see .env.example).
      SMTP_MAILER: ${SMTP_MAILER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Indobase Email}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-}
    volumes:
      - email_app_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - indobase_email_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-email.rule=${EMAIL_TRAEFIK_RULE:-Host(`email.indobase.in`)}
      - traefik.http.routers.indobase-email.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-email.tls=true
      - traefik.http.routers.indobase-email.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-email.loadbalancer.server.port=8080
    logging: *logging
