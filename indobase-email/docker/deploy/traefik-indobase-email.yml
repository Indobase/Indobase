# Indobase Email — Traefik file provider (optional if compose labels are enough)
#
# DNS:
#   email.indobase.fun → 72.61.242.251 (staging Hostinger) or deploy host
#   email.indobase.in  → 103.190.92.249 (prod Vyom)

http:
  routers:
    indobase-email:
      rule: Host(`email.indobase.in`) || Host(`email.indobase.fun`)
      entryPoints:
        - websecure
      service: indobase-email
      tls:
        certResolver: letsencrypt
        domains:
          - main: email.indobase.in
            sans:
              - email.indobase.fun

  services:
    indobase-email:
      loadBalancer:
        servers:
          - url: http://email-api:8080
