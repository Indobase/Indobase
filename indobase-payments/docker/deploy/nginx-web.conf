server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hashed assets (immutable, cache forever)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts (static, cache for 1 year)
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Studio SSO only — no Meteroid email/password UI reachable.
    location = /login { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /registration { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /forgot-password { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /reset-password { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /check-inbox { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /check-inbox-password { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }
    location = /validate-email { return 302 https://studio.indobase.in/sign-in?returnTo=%2F; }

    # HTML and other non-hashed files (never cache)
    location / {
        # Allow Studio to embed Payments (project /payments surface).
        add_header Content-Security-Policy "frame-ancestors 'self' https://studio.indobase.in https://studio.indobase.fun *.localhost" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
