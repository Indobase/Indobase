# Indobase Discuss — Mattermost + SSO bridge (Vyom .249)
#
# Hosts:
#   prod:    discuss.indobase.in
#   staging: discuss.indobase.fun
#
# Traefik hits the bridge (:8092). Bridge handles Studio SSO and proxies
# the Mattermost app (websockets included). Upstream engine is Mattermost
# (AGPL); customer UI is branded Indobase Discuss only.

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  discuss_postgres_data:
  discuss_mattermost_config:
  discuss_mattermost_data:
  discuss_mattermost_logs:
  discuss_mattermost_plugins:
  discuss_mattermost_client_plugins:
  discuss_mattermost_bleve:
  discuss_mm_secrets:
  discuss_mm_shared:

networks:
  discuss_net:
    name: indobase-discuss
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-discuss

services:
  discuss-postgres:
    <<: *restart
    image: postgres:${POSTGRES_IMAGE_TAG:-15-alpine}
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mattermost}
    volumes:
      - discuss_postgres_data:/var/lib/postgresql/data
    networks:
      - discuss_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mmuser} -d $${POSTGRES_DB:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  discuss-mattermost:
    <<: *restart
    image: mattermost/${MATTERMOST_IMAGE:-mattermost-team-edition}:${MATTERMOST_IMAGE_TAG:-10.5.2}
    depends_on:
      discuss-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER:-mmuser}:${POSTGRES_PASSWORD}@discuss-postgres:5432/${POSTGRES_DB:-mattermost}?sslmode=disable&connect_timeout=10
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_SERVICESETTINGS_SITEURL: ${DISCUSS_SITE_URL:-https://discuss.indobase.in}
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /shared/mattermost_local.socket
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
      MM_SERVICESETTINGS_FORWARDS80TO443: "false"
      MM_TEAMSETTINGS_SITENAME: Indobase Discuss
      MM_TEAMSETTINGS_ENABLECUSTOMBRAND: "true"
      MM_TEAMSETTINGS_CUSTOMBRANDTEXT: "Open Discuss from Indobase Studio — Studio is the only sign-in."
      MM_TEAMSETTINGS_CUSTOMDESCRIPTIONTEXT: "Team chat for your Indobase organization and project"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "5000"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      # Email/password UI is intercepted by the bridge (/login → Studio). API login stays
      # available so the SSO bridge can mint MMAUTHTOKEN sessions.
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
      MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: "true"
      MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_NATIVEAPPSETTINGS_APPDOWNLOADLINK: ""
      MM_NATIVEAPPSETTINGS_ANDROIDAPPDOWNLOADLINK: ""
      MM_NATIVEAPPSETTINGS_IOSAPPDOWNLOADLINK: ""
      MM_SUPPORTSETTINGS_SUPPORTEMAIL: ${DISCUSS_SUPPORT_EMAIL:-support@indobase.in}
      MM_SUPPORTSETTINGS_ABOUTLINK: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      MM_SUPPORTSETTINGS_HELPLINK: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      MM_SUPPORTSETTINGS_PRIVACYLINK: https://indobase.in/privacy
      MM_SUPPORTSETTINGS_TERMSOFSERVICELINK: https://indobase.in/terms
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: ${MM_LOG_LEVEL:-INFO}
    volumes:
      - discuss_mattermost_config:/mattermost/config
      - discuss_mattermost_data:/mattermost/data
      - discuss_mattermost_logs:/mattermost/logs
      - discuss_mattermost_plugins:/mattermost/plugins
      - discuss_mattermost_client_plugins:/mattermost/client/plugins
      - discuss_mattermost_bleve:/mattermost/bleve-indexes
      - discuss_mm_shared:/shared
    networks:
      - discuss_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging

  discuss-bootstrap:
    <<: *restart
    user: "0:0"
    image: mattermost/${MATTERMOST_IMAGE:-mattermost-team-edition}:${MATTERMOST_IMAGE_TAG:-10.5.2}
    depends_on:
      discuss-mattermost:
        condition: service_healthy
    environment:
      MATTERMOST_URL: http://discuss-mattermost:8065
      MATTERMOST_ADMIN_EMAIL: ${MATTERMOST_ADMIN_EMAIL:-discuss-admin@indobase.local}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD:?set MATTERMOST_ADMIN_PASSWORD}
      MATTERMOST_ADMIN_USERNAME: ${MATTERMOST_ADMIN_USERNAME:-ibdiscuss}
    volumes:
      - ../bootstrap-mattermost.sh:/scripts/bootstrap-mattermost.sh:ro
      - discuss_mm_secrets:/secrets
      - discuss_mm_shared:/shared
    entrypoint: ["/bin/sh", "/scripts/bootstrap-mattermost.sh"]
    networks:
      - discuss_net
    logging: *logging

  discuss-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      discuss-mattermost:
        condition: service_healthy
      discuss-bootstrap:
        condition: service_started
    environment:
      PORT: "8092"
      DISCUSS_HANDOFF_SECRET: ${DISCUSS_HANDOFF_SECRET:?set DISCUSS_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      MATTERMOST_URL: http://discuss-mattermost:8065
      MATTERMOST_ADMIN_TOKEN_FILE: /secrets/admin_token
      MATTERMOST_ADMIN_TOKEN: ${MATTERMOST_ADMIN_TOKEN:-}
      DISCUSS_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - discuss_mm_secrets:/secrets:ro
    networks:
      - discuss_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-discuss.rule=${DISCUSS_TRAEFIK_RULE:-Host(`discuss.indobase.in`) || Host(`discuss.indobase.fun`)}
      - traefik.http.routers.indobase-discuss.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-discuss.tls=true
      - traefik.http.routers.indobase-discuss.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-discuss.loadbalancer.server.port=8092
    logging: *logging
