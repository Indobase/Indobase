# Indobase Discuss — Traefik file provider (optional if compose labels suffice)
#
# DNS:
#   discuss.indobase.in  → Vyom 103.190.92.249
#   discuss.indobase.fun → add Host() + SAN only after A/AAAA exist (ACME NXDOMAIN
#   on missing SANs has flapped the docker router TLS).
#
# Public edge is the SSO bridge (:8092), which proxies Gameplan / Frappe.

http:
  routers:
    indobase-discuss:
      rule: Host(`discuss.indobase.in`)
      entryPoints:
        - websecure
      service: indobase-discuss
      tls:
        certResolver: letsencrypt
        domains:
          - main: discuss.indobase.in

  services:
    indobase-discuss:
      loadBalancer:
        servers:
          - url: http://discuss-bridge:8092
