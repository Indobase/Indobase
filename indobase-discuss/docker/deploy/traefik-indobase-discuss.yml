# Indobase Discuss — Traefik file provider (optional if compose labels suffice)
#
# DNS:
#   discuss.indobase.fun → staging (add SAN only when DNS exists)
#   discuss.indobase.in  → Vyom 103.190.92.249

http:
  routers:
    indobase-discuss:
      rule: Host(`discuss.indobase.in`)
      entryPoints:
        - websecure
      service: indobase-discuss
      tls:
        certResolver: letsencrypt
        domains:
          - main: discuss.indobase.in

  services:
    indobase-discuss:
      loadBalancer:
        servers:
          - url: http://discuss-bridge:8092
