# Traefik dynamic config for Indobase Design on Vyom .249
# Copy to /etc/dokploy/traefik/dynamic/indobase-design.yml
# Prefer container DNS over pinned overlay IPs (IPs change on recreate → 502).
# Docker labels on penpot-frontend / design-sso also register the same Host rules.
http:
  routers:
    indobase-design:
      rule: Host(`design.indobase.fun`) || Host(`design.indobase.in`)
      entryPoints:
        - websecure
      service: indobase-design
      tls:
        certResolver: letsencrypt
      priority: 10
    indobase-design-sso:
      rule: (Host(`design.indobase.fun`) || Host(`design.indobase.in`)) && PathPrefix(`/sso`)
      entryPoints:
        - websecure
      service: indobase-design-sso
      tls:
        certResolver: letsencrypt
      priority: 100
  services:
    indobase-design:
      loadBalancer:
        servers:
          - url: "http://indobase-design-penpot-frontend-1:8080"
        passHostHeader: true
    indobase-design-sso:
      loadBalancer:
        servers:
          - url: "http://indobase-design-design-sso-1:8600"
        passHostHeader: true
