# Indobase Design — production / staging Compose (Penpot engine, MPL-2.0)
#
# Usage on the control-plane VPS (Vyom .249):
#   cd /opt/indobase-design/docker/deploy
#   cp .env.example .env      # fill secrets (see docs/INDOBASE-DESIGN.md)
#   docker compose -f docker-compose.yml --env-file .env build
#   docker compose -f docker-compose.yml --env-file .env up -d
#
# Engine images are upstream Penpot (SHA-pinned via PENPOT_VERSION); the
# frontend is wrapped locally with the Indobase branding overlay and the SSO
# shim is built from ../../sso-shim (no npm dependencies).
#
# Hosts (Traefik, both routed here):
#   design.indobase.fun  (staging smoke)
#   design.indobase.in   (production, canonical PENPOT_PUBLIC_URI)

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

x-restart: &restart
  restart: unless-stopped

name: indobase-design

networks:
  indobase_design_net:
    name: indobase-design
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

volumes:
  design_pg_data:
  design_assets:

services:
  penpot-frontend:
    <<: *restart
    build:
      context: ../../frontend
      args:
        PENPOT_VERSION: ${PENPOT_VERSION:-2.17.0}
    image: indobase-design-frontend:${PENPOT_VERSION:-2.17.0}
    volumes:
      - design_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      PENPOT_FLAGS: enable-login-with-oidc disable-login-with-password disable-registration disable-onboarding
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
    networks:
      - indobase_design_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-design.rule=${DESIGN_TRAEFIK_RULE:-Host(`design.indobase.in`) || Host(`design.indobase.fun`)}
      - traefik.http.routers.indobase-design.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-design.tls=true
      - traefik.http.routers.indobase-design.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-design.service=indobase-design
      - traefik.http.services.indobase-design.loadbalancer.server.port=8080
    logging: *logging

  design-sso:
    <<: *restart
    build:
      context: ../../sso-shim
    image: indobase-design-sso:latest
    environment:
      PORT: 8600
      DESIGN_HANDOFF_SECRET: ${DESIGN_HANDOFF_SECRET:?set DESIGN_HANDOFF_SECRET}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-indobase-studio}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OIDC_ISSUER: http://design-sso:8600
      PUBLIC_ORIGIN: ${DESIGN_PUBLIC_URL:-https://design.indobase.in}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
    networks:
      - indobase_design_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # Longer rule -> higher default priority than the frontend router.
      - traefik.http.routers.indobase-design-sso.rule=(${DESIGN_TRAEFIK_RULE:-Host(`design.indobase.in`) || Host(`design.indobase.fun`)}) && PathPrefix(`/sso`)
      - traefik.http.routers.indobase-design-sso.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-design-sso.tls=true
      - traefik.http.routers.indobase-design-sso.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-design-sso.service=indobase-design-sso
      - traefik.http.services.indobase-design-sso.loadbalancer.server.port=8600
    logging: *logging

  penpot-backend:
    <<: *restart
    image: penpotapp/backend:${PENPOT_VERSION:-2.17.0}
    volumes:
      - design_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
      design-sso:
        condition: service_started
    environment:
      PENPOT_PUBLIC_URI: ${DESIGN_PUBLIC_URL:-https://design.indobase.in}
      PENPOT_FLAGS: enable-login-with-oidc enable-oidc-registration disable-login-with-password disable-registration disable-email-verification
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: ${DB_USER:-penpot}
      PENPOT_DATABASE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PENPOT_REDIS_URI: redis://penpot-valkey/0

      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets

      PENPOT_TELEMETRY_ENABLED: "false"

      # --- Studio SSO via the design-sso OIDC shim -------------------------
      PENPOT_OIDC_BASE_URI: http://design-sso:8600
      PENPOT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-indobase-studio}
      PENPOT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      PENPOT_OIDC_AUTH_URI: ${DESIGN_PUBLIC_URL:-https://design.indobase.in}/sso/oidc/authorize
      PENPOT_OIDC_TOKEN_URI: http://design-sso:8600/oidc/token
      PENPOT_OIDC_USER_URI: http://design-sso:8600/oidc/userinfo
      PENPOT_OIDC_JWKS_URI: http://design-sso:8600/oidc/jwks
      PENPOT_SSRF_ALLOWED_HOSTS: design-sso
    networks:
      - indobase_design_net
    logging: *logging

  penpot-exporter:
    <<: *restart
    image: penpotapp/exporter:${PENPOT_VERSION:-2.17.0}
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_PUBLIC_URI: ${DESIGN_PUBLIC_URL:-https://design.indobase.in}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY}
    networks:
      - indobase_design_net
    logging: *logging

  penpot-postgres:
    <<: *restart
    image: postgres:15
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    volumes:
      - design_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: ${DB_USER:-penpot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      - indobase_design_net
    logging: *logging

  penpot-valkey:
    <<: *restart
    image: valkey/valkey:8.1
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    networks:
      - indobase_design_net
    logging: *logging
