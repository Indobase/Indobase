# Indobase Workspace — production / staging Compose (Vyom .249)
#
# Hosts:
#   prod:    workspace.indobase.in
#   staging: workspace.indobase.fun
#
# First boot initializes Frappe bench + Suite (~10–15 min). Bridge serves SSO;
# Traefik terminates TLS and routes to bridge (which proxies /s/* to Suite).
#
# Bench data lives on suite_bench_sites → /home/frappe/persist (full bench, not
# sites-only). Host must chown the volume to uid/gid 1000 before first boot:
#   docker run --rm -v indobase-workspace_suite_bench_sites:/v alpine chown -R 1000:1000 /v

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  suite_mariadb_data:
  suite_bench_sites:

networks:
  suite_net:
    name: indobase-workspace
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-workspace

services:
  suite-mariadb:
    <<: *restart
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes:
      - suite_mariadb_data:/var/lib/mysql
    networks:
      - suite_net
    logging: *logging

  suite-redis:
    <<: *restart
    image: redis:7.2-alpine
    networks:
      - suite_net
    logging: *logging

  suite-frappe:
    <<: *restart
    image: frappe/bench:latest
    depends_on:
      - suite-mariadb
      - suite-redis
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      SUITE_SITE_NAME: ${SUITE_SITE_NAME:-workspace.localhost}
      SUITE_ADMIN_PASSWORD: ${SUITE_ADMIN_PASSWORD:-changeme}
      SUITE_HANDOFF_SECRET: ${SUITE_HANDOFF_SECRET:?set SUITE_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
    volumes:
      - suite_bench_sites:/home/frappe/persist
      - ../init-suite.sh:/workspace/init-suite.sh:ro
      - ../../frappe-app/indobase_suite:/workspace/indobase_suite:ro
    command: bash /workspace/init-suite.sh
    networks:
      - suite_net
    logging: *logging

  suite-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
    depends_on:
      - suite-frappe
    environment:
      PORT: "8093"
      SUITE_HANDOFF_SECRET: ${SUITE_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      SUITE_UPSTREAM: http://suite-frappe:8000
      FRAPPE_STUDIO_HANDOFF_URL: http://suite-frappe:8000/api/method/indobase_suite.api.studio_handoff.exchange
      INDOBASE_EMAIL_URL: ${INDOBASE_EMAIL_URL:-https://email.indobase.in}
      INDOBASE_DESIGN_URL: ${INDOBASE_DESIGN_URL:-https://design.indobase.in}
      SUITE_VERSION: ${SUITE_VERSION:-dev}
    networks:
      - suite_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # Prod default is .indobase.in only — include .fun only when that DNS exists (avoids LE NXDOMAIN + rate limits).
      - traefik.http.routers.indobase-workspace.rule=${SUITE_TRAEFIK_RULE:-Host(`workspace.indobase.in`)}
      - traefik.http.routers.indobase-workspace.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-workspace.tls=true
      - traefik.http.routers.indobase-workspace.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-workspace.loadbalancer.server.port=8093
    logging: *logging
