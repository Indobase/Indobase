# Indobase Workspace — DocumentServer + SSO bridge (Vyom .249)
#
# Hosts:
#   prod:    workspace.indobase.in  (+ alias suite.indobase.in)
#   staging: workspace.indobase.fun
#
# Traefik → bridge (:8093) for SSO / file shell / APIs.
# Traefik also routes `/ds` (+ native editor asset prefixes) straight to
# DocumentServer so WebSockets work; the bridge still proxies those paths as a
# fallback when Traefik labels are unavailable.
# Upstream engine is AGPL; customer UI is Indobase Workspace only.

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  workspace_files:
  workspace_documentserver_data:
  workspace_documentserver_logs:
  workspace_documentserver_db:

networks:
  workspace_net:
    name: indobase-workspace
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-workspace

services:
  workspace-documentserver:
    <<: *restart
    image: onlyoffice/documentserver:${DOCUMENT_SERVER_IMAGE_TAG:-8.3.1}
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCUMENT_JWT_SECRET:?set DOCUMENT_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # Allow bridge + public workspace origin to embed / call the editor
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    volumes:
      - workspace_documentserver_data:/var/www/onlyoffice/Data
      - workspace_documentserver_logs:/var/log/onlyoffice
      - workspace_documentserver_db:/var/lib/postgresql
    networks:
      - workspace_net
      - traefik_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # Prefer DocumentServer for /ds (WebSocket-safe) over the bridge HTTP proxy.
      - traefik.http.middlewares.indobase-workspace-ds-strip.stripprefix.prefixes=/ds
      - traefik.http.routers.indobase-workspace-ds.rule=(${SUITE_TRAEFIK_RULE:-Host(`workspace.indobase.in`) || Host(`suite.indobase.in`) || Host(`workspace.indobase.fun`)}) && PathPrefix(`/ds`)
      - traefik.http.routers.indobase-workspace-ds.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-workspace-ds.tls=true
      - traefik.http.routers.indobase-workspace-ds.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-workspace-ds.priority=200
      - traefik.http.routers.indobase-workspace-ds.middlewares=indobase-workspace-ds-strip
      - traefik.http.routers.indobase-workspace-ds.service=indobase-workspace-ds
      - traefik.http.services.indobase-workspace-ds.loadbalancer.server.port=80
      # Native engine paths when DocsAPI omits the /ds prefix.
      - traefik.http.routers.indobase-workspace-ds-native.rule=(${SUITE_TRAEFIK_RULE:-Host(`workspace.indobase.in`) || Host(`suite.indobase.in`) || Host(`workspace.indobase.fun`)}) && (PathPrefix(`/web-apps`) || PathPrefix(`/sdkjs`) || PathPrefix(`/sdkjs-plugins`) || PathPrefix(`/fonts`) || PathPrefix(`/coauthoring`) || PathPrefix(`/cache`) || PathPrefix(`/doceditor`) || PathPrefix(`/dictionaries`) || PathPrefix(`/converter`) || PathPrefix(`/downloadas`))
      - traefik.http.routers.indobase-workspace-ds-native.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-workspace-ds-native.tls=true
      - traefik.http.routers.indobase-workspace-ds-native.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-workspace-ds-native.priority=190
      - traefik.http.routers.indobase-workspace-ds-native.service=indobase-workspace-ds
    logging: *logging

  suite-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      workspace-documentserver:
        condition: service_healthy
    environment:
      PORT: "8093"
      SUITE_HANDOFF_SECRET: ${SUITE_HANDOFF_SECRET:?set SUITE_HANDOFF_SECRET}
      DOCUMENT_JWT_SECRET: ${DOCUMENT_JWT_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:-https://workspace.indobase.in}
      BRIDGE_INTERNAL_URL: ${BRIDGE_INTERNAL_URL:-http://suite-bridge:8093}
      DOCUMENT_SERVER_URL: http://workspace-documentserver
      DOCUMENT_SERVER_PUBLIC_URL: ${DOCUMENT_SERVER_PUBLIC_URL:-https://workspace.indobase.in/ds}
      WORKSPACE_DATA_DIR: /data/workspace
      INDOBASE_EMAIL_URL: ${INDOBASE_EMAIL_URL:-https://email.indobase.in}
      INDOBASE_DESIGN_URL: ${INDOBASE_DESIGN_URL:-https://design.indobase.in}
      SUITE_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - workspace_files:/data/workspace
    networks:
      - workspace_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-workspace.rule=${SUITE_TRAEFIK_RULE:-Host(`workspace.indobase.in`) || Host(`suite.indobase.in`) || Host(`workspace.indobase.fun`)}
      - traefik.http.routers.indobase-workspace.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-workspace.tls=true
      - traefik.http.routers.indobase-workspace.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-workspace.priority=100
      - traefik.http.services.indobase-workspace.loadbalancer.server.port=8093
    logging: *logging
