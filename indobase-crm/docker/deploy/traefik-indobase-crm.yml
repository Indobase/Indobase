# Indobase CRM — Traefik file provider (optional if compose labels suffice)
#
# DNS:
#   crm.indobase.fun → staging (add SAN only when DNS exists)
#   crm.indobase.in  → Vyom 103.190.92.249

http:
  routers:
    indobase-crm:
      rule: Host(`crm.indobase.in`)
      entryPoints:
        - websecure
      service: indobase-crm
      tls:
        certResolver: letsencrypt
        domains:
          - main: crm.indobase.in

  services:
    indobase-crm:
      loadBalancer:
        servers:
          - url: http://crm-bridge:8094
