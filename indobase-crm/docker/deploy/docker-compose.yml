# Indobase CRM — production / staging Compose (Vyom .249)
#
# Hosts:
#   prod:    crm.indobase.in
#   staging: crm.indobase.fun
#
# Stack: SSO bridge + Twenty CRM (AGPL). Customer UI is Indobase-branded only.
#
# Multi-tenant: one Twenty workspace per Indobase organization. The bridge
# creates workspaces on first SSO and stores invite hashes in a volume-backed
# map (CRM_WORKSPACE_MAP_PATH). Project scope is soft (ib_pipeline query only).
#
# Requires IS_MULTIWORKSPACE_ENABLED=true. Users stay on crm.indobase.in; the
# bridge rewrites GraphQL `origin` to the org workspace subdomain.

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  crm_pg_data:
  crm_twenty_data:
  crm_bridge_data:

networks:
  crm_net:
    name: indobase-crm
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-crm

services:
  crm-db:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD}
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    networks:
      - crm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  crm-redis:
    <<: *restart
    image: redis:7.2-alpine
    command: ["--maxmemory-policy", "noeviction"]
    networks:
      - crm_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  crm-twenty:
    <<: *restart
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    depends_on:
      crm-db:
        condition: service_healthy
      crm-redis:
        condition: service_healthy
    environment:
      NODE_PORT: "3000"
      SERVER_URL: ${CRM_PUBLIC_URL:-https://crm.indobase.in}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@crm-db:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: redis://crm-redis:6379
      # Official Twenty self-host: ENCRYPTION_KEY for at-rest secrets; APP_SECRET for JWTs.
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY}
      APP_SECRET: ${TWENTY_APP_SECRET:?set TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      # One workspace per Indobase org (Discuss-style isolation).
      IS_MULTIWORKSPACE_ENABLED: "true"
      DEFAULT_SUBDOMAIN: ${TWENTY_DEFAULT_SUBDOMAIN:-app}
      IS_EMAIL_VERIFICATION_REQUIRED: "false"
      # Sign-in is via Studio SSO bridge — keep password auth for bridge-derived credentials only.
      AUTH_PASSWORD_ENABLED: "true"
    volumes:
      - crm_twenty_data:/app/packages/twenty-server/.local-storage
    networks:
      - crm_net
    healthcheck:
      # First boot runs database:init + upgrade + cron register before listening.
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s
    logging: *logging

  crm-twenty-worker:
    <<: *restart
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    command: ["yarn", "worker:prod"]
    depends_on:
      crm-db:
        condition: service_healthy
      crm-redis:
        condition: service_healthy
      crm-twenty:
        condition: service_healthy
    environment:
      SERVER_URL: ${CRM_PUBLIC_URL:-https://crm.indobase.in}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@crm-db:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: redis://crm-redis:6379
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY}
      APP_SECRET: ${TWENTY_APP_SECRET:?set TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      IS_MULTIWORKSPACE_ENABLED: "true"
      DEFAULT_SUBDOMAIN: ${TWENTY_DEFAULT_SUBDOMAIN:-app}
      IS_EMAIL_VERIFICATION_REQUIRED: "false"
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - crm_twenty_data:/app/packages/twenty-server/.local-storage
    networks:
      - crm_net
    logging: *logging

  crm-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      crm-twenty:
        condition: service_healthy
    environment:
      PORT: "8094"
      CRM_HANDOFF_SECRET: ${CRM_HANDOFF_SECRET:?set CRM_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-https://crm.indobase.in}
      CRM_UPSTREAM: http://crm-twenty:3000
      CRM_WORKSPACE_MAP_PATH: /var/lib/indobase-crm/workspace-map.json
      # Optional legacy single-workspace invite — claimed by the first org only when the map is empty.
      TWENTY_WORKSPACE_INVITE_HASH: ${TWENTY_WORKSPACE_INVITE_HASH:-}
      # Per-org workspace create on SSO (default true). Set false only for break-glass.
      TWENTY_ALLOW_BOOTSTRAP_WORKSPACE: ${TWENTY_ALLOW_BOOTSTRAP_WORKSPACE:-true}
      CRM_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - crm_bridge_data:/var/lib/indobase-crm
    networks:
      - crm_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-crm.rule=${CRM_TRAEFIK_RULE:-Host(`crm.indobase.in`)}
      - traefik.http.routers.indobase-crm.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-crm.tls=true
      - traefik.http.routers.indobase-crm.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-crm.loadbalancer.server.port=8094
    logging: *logging
