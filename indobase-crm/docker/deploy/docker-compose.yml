# Indobase CRM — production / staging Compose (Vyom .249)
#
# Hosts:
#   prod:    crm.indobase.in
#   staging: crm.indobase.fun
#
# First boot initializes Frappe bench + Frappe CRM (~5–10 min). Bridge serves SSO;
# Traefik terminates TLS and routes to bridge (which proxies /c/* and /crm/* to upstream).
#
# Bench data lives on crm_bench_sites → /home/frappe/persist (full bench, not
# sites-only). Host must chown the volume to uid/gid 1000 before first boot:
#   docker run --rm -v indobase-crm_crm_bench_sites:/v alpine chown -R 1000:1000 /v

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

volumes:
  crm_mariadb_data:
  crm_bench_sites:

networks:
  crm_net:
    name: indobase-crm
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-crm

services:
  crm-mariadb:
    <<: *restart
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes:
      - crm_mariadb_data:/var/lib/mysql
    networks:
      - crm_net
    logging: *logging

  crm-redis:
    <<: *restart
    image: redis:7.2-alpine
    networks:
      - crm_net
    logging: *logging

  crm-frappe:
    <<: *restart
    image: frappe/bench:latest
    depends_on:
      - crm-mariadb
      - crm-redis
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      CRM_SITE_NAME: ${CRM_SITE_NAME:-crm.localhost}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-changeme}
      CRM_HANDOFF_SECRET: ${CRM_HANDOFF_SECRET:?set CRM_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
    volumes:
      - crm_bench_sites:/home/frappe/persist
      - ../init-crm.sh:/workspace/init-crm.sh:ro
      - ../../frappe-app/indobase_crm:/workspace/indobase_crm:ro
    command: bash /workspace/init-crm.sh
    networks:
      - crm_net
    logging: *logging

  crm-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      - crm-frappe
    environment:
      PORT: "8094"
      CRM_HANDOFF_SECRET: ${CRM_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      CRM_UPSTREAM: http://crm-frappe:8000
      FRAPPE_STUDIO_HANDOFF_URL: http://crm-frappe:8000/api/method/indobase_crm.api.studio_handoff.exchange
      CRM_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    networks:
      - crm_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # Prod default is .indobase.in only — include .fun only when that DNS exists (avoids LE NXDOMAIN + rate limits).
      - traefik.http.routers.indobase-crm.rule=${CRM_TRAEFIK_RULE:-Host(`crm.indobase.in`)}
      - traefik.http.routers.indobase-crm.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-crm.tls=true
      - traefik.http.routers.indobase-crm.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.indobase-crm.loadbalancer.server.port=8094
    logging: *logging
