# Indobase Meet — SSO bridge + invisible media engine (Vyom .249)
#
# Hosts:
#   prod:    meet.indobase.in
#   staging: meet.indobase.fun
#
# Traefik hits the bridge (:8094). Bridge handles Studio SSO, brands HTML,
# and proxies the engine web UI. Customer chrome never names the engine.
#
# CRITICAL: expose UDP 10000 on the host firewall for the video bridge (JVB).

x-default-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-restart: &restart
  restart: unless-stopped

networks:
  meet_net:
    name: indobase-meet
  traefik_public:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

name: indobase-meet

volumes:
  meet_web_config:
  meet_web_storage:
  meet_prosody_config:
  meet_prosody_data:
  meet_prosody_plugins:
  meet_jicofo_config:
  meet_jvb_config:

services:
  meet-web:
    <<: *restart
    image: jitsi/web:${MEET_IMAGE_VERSION:-stable-10078}
    depends_on:
      - meet-jvb
    volumes:
      - meet_web_config:/config
      - meet_web_storage:/usr/share/jitsi-meet/transcripts
    environment:
      PUBLIC_URL: ${MEET_PUBLIC_URL:-https://meet.indobase.in}
      TZ: ${TZ:-UTC}
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_WELCOME_PAGE: "0"
      ENABLE_CLOSE_PAGE: "0"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_AUTH: ${MEET_ENABLE_AUTH:-1}
      AUTH_TYPE: ${MEET_AUTH_TYPE:-jwt}
      JWT_APP_ID: ${JWT_APP_ID:-}
      JWT_APP_SECRET: ${JWT_APP_SECRET:-}
      JWT_ACCEPTED_ISSUERS: ${JWT_APP_ID:-}
      JWT_ACCEPTED_AUDIENCES: ${JWT_APP_ID:-}
      JWT_ALLOW_EMPTY: ${JWT_ALLOW_EMPTY:-0}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://meet-prosody:5280
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      TOOLBAR_BUTTONS: microphone,camera,desktop,chat,raisehand,participants-pane,tileview,toggle-camera,hangup,settings,fullscreen
    networks:
      - meet_net
    logging: *logging

  meet-prosody:
    <<: *restart
    image: jitsi/prosody:${MEET_IMAGE_VERSION:-stable-10078}
    volumes:
      - meet_prosody_config:/config
      - meet_prosody_plugins:/prosody-plugins-custom
      - meet_prosody_data:/var/lib/prosody
    environment:
      TZ: ${TZ:-UTC}
      AUTH_TYPE: ${MEET_AUTH_TYPE:-jwt}
      ENABLE_AUTH: ${MEET_ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${MEET_ENABLE_GUESTS:-0}
      ENABLE_XMPP_WEBSOCKET: "1"
      JWT_APP_ID: ${JWT_APP_ID:-}
      JWT_APP_SECRET: ${JWT_APP_SECRET:-}
      JWT_ACCEPTED_ISSUERS: ${JWT_APP_ID:-}
      JWT_ACCEPTED_AUDIENCES: ${JWT_APP_ID:-}
      JWT_ALLOW_EMPTY: ${JWT_ALLOW_EMPTY:-0}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?set JICOFO_AUTH_PASSWORD}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?set JVB_AUTH_PASSWORD}
      JIGASI_XMPP_PASSWORD: ${JIGASI_XMPP_PASSWORD:-unused-jigasi}
      JIGASI_TRANSCRIBER_PASSWORD: ${JIGASI_TRANSCRIBER_PASSWORD:-unused-transcriber}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-unused-recorder}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-unused-jibri}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JVB_AUTH_USER: jvb
      PUBLIC_URL: ${MEET_PUBLIC_URL:-https://meet.indobase.in}
    networks:
      meet_net:
        aliases:
          - xmpp.meet.jitsi
    logging: *logging

  meet-jicofo:
    <<: *restart
    image: jitsi/jicofo:${MEET_IMAGE_VERSION:-stable-10078}
    depends_on:
      - meet-prosody
    volumes:
      - meet_jicofo_config:/config
    environment:
      TZ: ${TZ:-UTC}
      AUTH_TYPE: ${MEET_AUTH_TYPE:-jwt}
      ENABLE_AUTH: ${MEET_ENABLE_AUTH:-1}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
    networks:
      - meet_net
    logging: *logging

  meet-jvb:
    <<: *restart
    image: jitsi/jvb:${MEET_IMAGE_VERSION:-stable-10078}
    depends_on:
      - meet-prosody
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
    volumes:
      - meet_jvb_config:/config
    environment:
      TZ: ${TZ:-UTC}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_AUTH_USER: jvb
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: ${JVB_PORT:-10000}
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:-103.190.92.249}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
    networks:
      - meet_net
    logging: *logging

  meet-bridge:
    <<: *restart
    build:
      context: ../../bridge
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      - meet-web
    environment:
      PORT: "8094"
      MEET_HANDOFF_SECRET: ${MEET_HANDOFF_SECRET:?set MEET_HANDOFF_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.indobase.in}
      MEET_PUBLIC_URL: ${MEET_PUBLIC_URL:-https://meet.indobase.in}
      MEET_ENGINE_URL: http://meet-web:80
      JWT_APP_ID: ${JWT_APP_ID:-}
      JWT_APP_SECRET: ${JWT_APP_SECRET:-}
      MEET_VERSION: ${GIT_SHA:-dev}
      GIT_SHA: ${GIT_SHA:-dev}
    networks:
      - meet_net
      - traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.indobase-meet.rule=${MEET_TRAEFIK_RULE:-Host(`meet.indobase.in`) || Host(`meet.indobase.fun`)}
      - traefik.http.routers.indobase-meet.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.indobase-meet.tls=true
      - traefik.http.routers.indobase-meet.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.indobase-meet.priority=100
      - traefik.http.services.indobase-meet.loadbalancer.server.port=8094
    logging: *logging
